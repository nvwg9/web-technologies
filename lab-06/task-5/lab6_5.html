<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота 6. Завдання 5</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="page">
    <div class="weather">
        <div class="weather-card">
            <div class="weather-now">17</div>
            <div class="weather-shade"></div>
            <div class="weather-info">Хмарно, вітер 3 м/с</div>
        </div>

        <div class="weather-cloud">
            <span class="cloud-part cloud-part--1"></span>
            <span class="cloud-part cloud-part--2"></span>
            <span class="cloud-part cloud-part--3"></span>
            <span class="cloud-part cloud-part--4"></span>
            <span class="cloud-part cloud-part--5"></span>
        </div>

        <div class="weather-arrows">
            <a class="weather-arrow" href="#">&larr;</a>
            <a class="weather-arrow weather-arrow--next" href="#">&rarr;</a>
        </div>

        <ul class="weather-week">
            <li class="weather-day"><span class="weather-day-name">Mon</span>17°</li>
            <li class="weather-day"><span class="weather-day-name">Tue</span>19°</li>
            <li class="weather-day"><span class="weather-day-name">Wed</span>16°</li>
            <li class="weather-day"><span class="weather-day-name">Thu</span>18°</li>
            <li class="weather-day"><span class="weather-day-name">Fri</span>21°</li>
        </ul>
    </div>
</body>
</html>
