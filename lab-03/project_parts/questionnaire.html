<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Завдання 4 — Анкета</title>
</head>
<body>

<div align="center">
  <h1>Завдання 4: Анкета користувача</h1>

  <form action="questionnaire.html" method="get">
    <table border="0" width="600" cellpadding="5">
      <tr>
        <td>

          <fieldset>
            <legend><b>Облікові та контактні дані</b></legend>
            <br>

            <label for="user_name">Ім'я та прізвище:</label><br>
            <input type="text" id="user_name" name="user_name" value="" placeholder="Введіть повне ім'я" required tabindex="1">
            <br><br>

            <label for="user_password">Пароль (рівно 6 символів: 1 велика, 1 мала літера, 1 цифра):</label><br>
            <input type="password" id="user_password" name="user_password" value="" placeholder="Введіть пароль" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{6}" title="Пароль має містити рівно 6 символів, принаймні одну цифру, одну малу та одну велику літеру" required tabindex="2">
            <br><br>

            <label for="user_email">Електронна пошта (без автозаповнення):</label><br>
            <input type="email" id="user_email" name="user_email" value="" placeholder="name@domain.com" autocomplete="off" pattern="[a-z0-9._%+\-]+@[a-z0-9.\-]+\.[a-z]{2,}$" required tabindex="3">
            <br><br>

            <label for="user_phone">Номер мобільного телефону:</label><br>
            <input type="tel" id="user_phone" name="user_phone" value="" placeholder="+380XXXXXXXXX" pattern="\+380[0-9]{9}" required tabindex="4">
            <br><br>

            <label for="user_birth">Дата народження:</label><br>
            <input type="date" id="user_birth" name="user_birth" value="" tabindex="5">
            <br><br>

            <label for="user_bio">Коротка інформація про себе:</label><br>
            <textarea id="user_bio" name="user_bio" rows="4" cols="45" placeholder="Напишіть кілька речень про себе..." tabindex="6"></textarea>
          </fieldset>

          <br>

          <fieldset>
            <legend><b>Вибір варіантів</b></legend>
            <br>

            <b>Форма навчання:</b><br>
            <label><input type="radio" name="study_form" value="full-time" tabindex="7"> Денна</label><br>
            <label><input type="radio" name="study_form" value="part-time" tabindex="8"> Заочна</label><br>
            <label><input type="radio" name="study_form" value="distance" tabindex="9"> Дистанційна</label>
            <br><br>

            <b>Поточний курс:</b><br>
            <label><input type="radio" name="study_year" value="year_1" tabindex="10"> 1 курс</label><br>
            <label><input type="radio" name="study_year" value="year_2" checked tabindex="11"> 2 курс (за замовчуванням)</label><br>
            <label><input type="radio" name="study_year" value="year_3" tabindex="12"> 3 курс</label>
            <br><br>

            <b>Сфера інтересів:</b><br>
            <label><input type="checkbox" name="interests" value="web" tabindex="13"> Web-розробка</label><br>
            <label><input type="checkbox" name="interests" value="design" tabindex="14"> UI/UX Дизайн</label><br>
            <label><input type="checkbox" name="interests" value="mobile" tabindex="15"> Мобільні додатки</label><br>
            <label><input type="checkbox" name="interests" value="ai" tabindex="16"> Штучний інтелект</label>
          </fieldset>

          <br>

          <fieldset>
            <legend><b>Списки та налаштування</b></legend>
            <br>

            <label for="city_select">Місто проживання (5 варіантів):</label><br>
            <select id="city_select" name="city" tabindex="17">
              <option value="kyiv">Київ</option>
              <option value="lviv">Львів</option>
              <option value="chernivtsi" selected>Чернівці (за замовчуванням)</option>
              <option value="odesa">Одеса</option>
              <option value="kharkiv">Харків</option>
            </select>
            <br><br>

            <label for="langs_select">Мови програмування (множинний вибір, 6 варіантів):</label><br>
            <select id="langs_select" name="programming_languages" multiple size="4" tabindex="18">
              <option value="cpp">C++</option>
              <option value="csharp">C#</option>
              <option value="javascript">JavaScript</option>
              <option value="python">Python</option>
              <option value="html_css">HTML / CSS</option>
              <option value="sql">SQL</option>
            </select>
            <br><br>

            <label for="disciplines">Улюблена навчальна дисципліна (групований список):</label><br>
            <select id="disciplines" name="disciplines" tabindex="19">
              <optgroup label="Математичний блок">
                <option value="math_1">Вища математика</option>
                <option value="math_2">Дискретна математика</option>
                <option value="math_3">Теорія ймовірностей</option>
              </optgroup>
              <optgroup label="Програмування">
                <option value="prog_1">Алгоритми та структури даних</option>
                <option value="prog_2">Об'єктно-орієнтоване програмування</option>
                <option value="prog_3">Web-технології</option>
              </optgroup>
              <optgroup label="Апаратне забезпечення">
                <option value="hw_1">Архітектура ЕОМ</option>
                <option value="hw_2">Операційні системи</option>
                <option value="hw_3">Комп'ютерні мережі</option>
              </optgroup>
              <optgroup label="Гуманітарний блок">
                <option value="hum_1">Іноземна мова</option>
                <option value="hum_2">Філософія</option>
                <option value="hum_3">Українська мова за проф. спрямуванням</option>
              </optgroup>
            </select>
            <br><br>

            <label for="browser_input">Основний веб-браузер (список з автопідказками):</label><br>
            <input list="browsers_list" id="browser_input" name="browser" value="" placeholder="Почніть вводити назву..." tabindex="20">
            <datalist id="browsers_list">
              <option value="Google Chrome">
              <option value="Mozilla Firefox">
              <option value="Apple Safari">
              <option value="Microsoft Edge">
              <option value="Opera">
            </datalist>
          </fieldset>

          <br>

          <fieldset>
            <legend><b>Додаткові матеріали</b></legend>
            <br>
            <label for="audio_upload">Завантажити аудіофайли (тільки аудіо, кілька файлів):</label><br>
            <input type="file" id="audio_upload" name="audio_files" accept="audio/*" multiple tabindex="21">
          </fieldset>

          <br>

          <div align="center">
            <input type="submit" value="Надіслати (GET — параметри в URL)" tabindex="22">
            &nbsp;
            <button type="submit" formmethod="post" formenctype="multipart/form-data" tabindex="23">Надіслати (POST multipart)</button>
            &nbsp;
            <input type="reset" value="Очистити форму" tabindex="24">
          </div>

        </td>
      </tr>
    </table>
  </form>

  <br>
  <p>
    <a href="../index.html">Повернутись на головну</a>
  </p>
  <br>
</div>

</body>
</html>
